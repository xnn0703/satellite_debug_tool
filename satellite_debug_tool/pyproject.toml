[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite_debug_tool"
version = "0.1.0"
description = "Satellite communication debug tool"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5",
    "pyserial>=3.5",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["core*", "ui*", "io*"]
