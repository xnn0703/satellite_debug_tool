name: Windows graphics diagnostics
on: workflow_dispatch
jobs:
  source-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r satellite_debug_tool/requirements.txt
      - name: Compare source application
        shell: pwsh
        run: |
          @'
          import os,sys,json,subprocess
          from pathlib import Path
          from importlib.metadata import version
          print({name:version(name) for name in ('PySide6','pyqtgraph','PyOpenGL')},flush=True)
          Path('release').mkdir(exist_ok=True)
          outcomes={}
          for name,extra in (('default',{}),('desktop',{'QT_OPENGL':'desktop'}),('offscreen',{'QT_QPA_PLATFORM':'offscreen'})):
              output=f'release/source-smoke-{name}.json'
              code="from satellite_debug_tool.smoke_diagnostics import install; install(); import runpy; runpy.run_module('satellite_debug_tool.main_user',run_name='__main__')"
              with open(f'release/source-smoke-{name}.log','w') as log:
                  result=subprocess.run([sys.executable,'-c',code,'--smoke-test',f'--smoke-output={output}'],env=dict(os.environ,**extra),stdout=log,stderr=log,timeout=60)
              outcomes[name]=result.returncode
          print(json.dumps(outcomes),flush=True)
          for path in Path('release').glob('source-smoke*'):
              print(path.name,path.read_text(encoding='utf-8',errors='replace')[-6000:],flush=True)
          Path('release/source-smoke-outcomes.json').write_text(json.dumps(outcomes))
          '@ | python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-graphics-diagnostics
          path: release/source-smoke*
          retention-days: 7
