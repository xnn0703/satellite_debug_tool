name: Build and stage release candidates

on:
  push:
    tags: ['v*']
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

# 普通构建不持有上传、签名或 GitHub Release 写权限。
permissions:
  contents: read

jobs:
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve immutable source SHA and source version
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python scripts/resolve_release.py

  build-windows-release:
    needs: prepare-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [user, ops]
    env:
      SATELLITE_BUILD_COMMIT: ${{ needs.prepare-release.outputs.commit }}
      SATELLITE_UPDATE_CHECK: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/build-*.txt
      - name: Restore constrained build environment
        run: python -m pip install -r requirements/build-windows.txt
      - name: Source regression and translations
        run: |
          python -m pytest satellite_debug_tool/tests -q
          python scripts/update_translations.py check
      - name: Build immutable edition
        run: python scripts/build_editions.py ${{ matrix.edition }}
      - name: Frozen software smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/check_frozen_application.py --edition ${{ matrix.edition }} --version "${{ needs.prepare-release.outputs.tag }}"
      # Authenticode 如配置，应在此步骤之前完成，然后冻结最终文件树。
      # unsigned 候选如实记录；TUF 正式签名由独立晋升流程负责。
      - name: Package final payload and exact build environment
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.tag }}
          EDITION: ${{ matrix.edition }}
        run: |
          $folder = python -c "from satellite_debug_tool.package_names import edition_directory; import os; print(edition_directory(os.environ['EDITION']))"
          python scripts/release_artifacts.py --payload "dist/$env:EDITION/$folder" --output "release/candidate-$env:EDITION" --source-commit $env:SATELLITE_BUILD_COMMIT --version $env:RELEASE_VERSION --signature unsigned
      - name: Preserve frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ matrix.edition }}
          path: release/smoke-*
          if-no-files-found: warn
      - name: Preserve validated candidate bytes
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.edition }}
          path: release/candidate-${{ matrix.edition }}/
          if-no-files-found: error
          retention-days: 14

  upload-candidates:
    needs: [prepare-release, build-windows-release]
    runs-on: ubuntu-latest
    # 仓库管理员为此 environment 配置审批和受保护 tag。
    environment: release-candidate
    concurrency:
      group: release-candidate-${{ needs.prepare-release.outputs.commit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-candidate-*
          path: release/candidates
      - run: python -m pip install -r requirements/deploy.txt
      - name: Upload candidates outside the public web root
        env:
          RELEASE_ID: ${{ needs.prepare-release.outputs.commit }}
          UPLOAD_KEY: ${{ secrets.RELEASE_UPLOAD_SSH_KEY }}
          UPLOAD_KNOWN_HOSTS: ${{ secrets.RELEASE_UPLOAD_KNOWN_HOSTS }}
          UPLOAD_CONFIG: ${{ vars.RELEASE_UPLOAD_CONFIG }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='satellite-upload-') as directory:
              root = pathlib.Path(directory)
              for name, key in [('key', 'UPLOAD_KEY'), ('known_hosts', 'UPLOAD_KNOWN_HOSTS'), ('config.json', 'UPLOAD_CONFIG')]:
                  value = os.environ[key]
                  if not value.strip():
                      raise SystemExit('release upload configuration is incomplete')
                  path = root / name
                  path.write_text(value, encoding='utf-8')
                  path.chmod(0o600)
              receipts = sorted(pathlib.Path('release/candidates').glob('*/receipt.json'))
              if len(receipts) != 2:
                  raise SystemExit('both edition receipts are required')
              for receipt in receipts:
                  subprocess.run([sys.executable, 'scripts/upload_release.py', '--config', str(root/'config.json'),
                      '--receipt', str(receipt), '--release-id', os.environ['RELEASE_ID'],
                      '--known-hosts', str(root/'known_hosts'), '--identity-file', str(root/'key')], check=True)
          PY

  ci-only-build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [user, ops]
    env:
      SATELLITE_UPDATE_CHECK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/build-*.txt
      - run: python -m pip install -r requirements/build-windows.txt
      - run: python -m pytest satellite_debug_tool/tests -q
      - run: python scripts/build_editions.py ${{ matrix.edition }}
      - name: Frozen software smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/check_frozen_application.py --edition ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-smoke-${{ matrix.edition }}
          path: release/smoke-*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.edition }}
          path: release/*.zip
          if-no-files-found: error
