name: Build & Release

# 触发：
#   - 推 v* tag → 完整 GitHub Release（prepare → Windows build → upload）
#   - 手动 dispatch → 同上（input 自定 tag）
#   - 推到 master/main → 仅构建并上传 GH artifact（不发版）
on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.0.1-rc1'

# 给所有 job 默认权限：contents: write 是创建 / 上传 GitHub Release 所需
permissions:
  contents: write

jobs:

  # ============================================================
  # 1. prepare-release  仅 tag/dispatch 时跑：解析发布标签
  # ============================================================
  prepare-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved tag: ${TAG}"

      - name: Remove stale v1.1.0 Gitee release metadata
        if: steps.resolve.outputs.tag == 'v1.1.0'
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          RESP=$(curl -sS --connect-timeout 5 --max-time 15 \
            "https://gitee.com/api/v5/repos/soft-hertz/satellite_debug_tool_release/releases/tags/v1.1.0" || true)
          REL_ID=$(echo "$RESP" | python3 -c "import sys,json
          try:
            d=json.load(sys.stdin); print(d.get('id') or '')
          except Exception:
            print('')")
          if [[ -n "${REL_ID}" ]]; then
            curl --fail-with-body --show-error --silent --connect-timeout 5 --max-time 15 \
              -X DELETE \
              "https://gitee.com/api/v5/repos/soft-hertz/satellite_debug_tool_release/releases/${REL_ID}?access_token=${GITEE_TOKEN}"
            echo "Removed stale Gitee release metadata id=${REL_ID}"
          else
            echo "No stale Gitee v1.1.0 release metadata found"
          fi

  # ============================================================
  # 2a. build-windows
  # ============================================================
  build-windows:
    runs-on: windows-latest
    needs: prepare-release
    # 推 master/main 时 prepare-release 跳过，所以 needs 为 null → 这里也跳过
    if: always() && needs.prepare-release.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r satellite_debug_tool/requirements.txt

      - name: Build (main + updater + simulator)
        shell: cmd
        run: scripts\build_windows.bat

      - name: Layout release dir
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare-release.outputs.tag }}"
          $name = "satellite_debug_tool-win-${tag}"
          New-Item -ItemType Directory -Path "release/${name}" -Force | Out-Null
          Copy-Item -Recurse "dist/SatelliteDebugTool/*" "release/${name}/"
          if (Test-Path "doc/WINDOWS_QUICK_START.md") {
            Copy-Item "doc/WINDOWS_QUICK_START.md" "release/${name}/README-Windows.md"
          }
          if (Test-Path "doc/user_manual.md") {
            Copy-Item "doc/user_manual.md" "release/${name}/user_manual.md"
          }
          if (Test-Path "doc/user_manual_en.md") {
            Copy-Item "doc/user_manual_en.md" "release/${name}/user_manual_en.md"
          }
          echo "RELEASE_NAME=${name}" >> $env:GITHUB_ENV

      - name: Create 7z archive
        shell: pwsh
        run: |
          $name = $env:RELEASE_NAME
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=9 -mf=off -mmt=on `
            "release/${name}.7z" "release/${name}/" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip failed with exit code $LASTEXITCODE"
          }
          Get-Item "release/${name}.7z"

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Release ${{ needs.prepare-release.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Windows

            Download the single `.7z` archive, extract it with 7-Zip, and run `SatelliteDebugTool.exe`.

            下载单个 `.7z` 压缩包，使用 7-Zip 解压后运行 `SatelliteDebugTool.exe`。

            ## macOS

            macOS packages are built locally and distributed separately.
          files: release/satellite_debug_tool-win-${{ needs.prepare-release.outputs.tag }}.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # build-macos 已移除：mac 在线打包遇到 PyInstaller .app symlink 复杂性
  # （Python.framework / Qt frameworks 1500+ symlinks + 7z 不稳定），改本地脚本：
  #     ./scripts/build_macos.sh
  # 本地脚本会自动 venv + 装依赖 + ditto 打包，产物 release/SatelliteDebugTool-macOS-<arch>.zip
  # mac 用户拿到 zip 解压双击即可；mac 平台不走自动升级链路（updater 仍嵌入但触发频率为零）。

  # ============================================================
  # 3. ci-only-build  (master/main 推送 → 仅本地构建验证 + 上传 GH artifact)
  # ============================================================
  ci-only-build:
    name: CI build (no release, win only)
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r satellite_debug_tool/requirements.txt
      - name: Build
        shell: cmd
        run: scripts\build_windows.bat
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SatelliteDebugTool-Windows-ci
          path: release/*.zip
          retention-days: 7
          if-no-files-found: warn
