name: Build & Release

# 触发：
#   - 推 v* tag → 完整 release（prepare → 并行 build → finalize）
#   - 手动 dispatch → 同上（input 自定 tag）
#   - 推到 master/main → 仅构建并上传 GH artifact（不发版）
on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.0.1-rc1'

env:
  GITEE_OWNER: soft-hertz
  GITEE_REPO: satellite_debug_tool_release
  GITHUB_OWNER: xnn0703
  GITHUB_REPO: satellite_debug_tool

# 给所有 job 默认权限：contents: write 是创建 / 上传 GitHub Release 所需
permissions:
  contents: write

jobs:

  # ============================================================
  # 1. prepare-release  仅 tag/dispatch 时跑：在 Gitee 建空 release
  # ============================================================
  prepare-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      gitee_release_id: ${{ steps.gitee.outputs.id }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved tag: ${TAG}"

      - name: Delete existing Gitee release (if any)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          REL_JSON=$(curl -sS \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" || true)
          REL_ID=$(echo "$REL_JSON" | python3 -c "import sys,json
          try:
            d=json.load(sys.stdin); print(d.get('id') or '')
          except Exception:
            print('')" 2>/dev/null || echo "")
          if [[ -n "${REL_ID}" ]]; then
            echo "Deleting old Gitee release id=${REL_ID}"
            curl -sS -X DELETE \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${REL_ID}?access_token=${GITEE_TOKEN}"
          fi

      - name: Create empty Gitee release
        id: gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          RESP=$(curl -sS -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
            -d "access_token=${GITEE_TOKEN}" \
            -d "tag_name=${TAG}" \
            -d "name=Release ${TAG}" \
            -d "body=Pending build... (assets will be attached after build jobs finish)" \
            -d "prerelease=false" \
            -d "target_commitish=master")
          REL_ID=$(echo "$RESP" | python3 -c "import sys,json
          try:
            d=json.load(sys.stdin); print(d.get('id') or '')
          except Exception:
            print('')")
          if [[ -z "${REL_ID}" ]]; then
            echo "Failed to create Gitee release. Response: $RESP"
            exit 1
          fi
          echo "id=${REL_ID}" >> $GITHUB_OUTPUT
          echo "Created Gitee release id=${REL_ID}"

  # ============================================================
  # 2a. build-windows
  # ============================================================
  build-windows:
    runs-on: windows-latest
    needs: prepare-release
    # 推 master/main 时 prepare-release 跳过，所以 needs 为 null → 这里也跳过
    if: always() && (needs.prepare-release.result == 'success' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r satellite_debug_tool/requirements.txt

      - name: Build (main + updater + simulator)
        shell: cmd
        run: scripts\build_windows.bat

      - name: Layout release dir
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare-release.outputs.tag }}"
          $name = "satellite_debug_tool-win-${tag}"
          New-Item -ItemType Directory -Path "release/${name}" -Force | Out-Null
          Copy-Item -Recurse "dist/SatelliteDebugTool/*" "release/${name}/"
          if (Test-Path "BUILDING.md") {
            Copy-Item "BUILDING.md" "release/${name}/使用说明.md"
          }
          echo "RELEASE_NAME=${name}" >> $env:GITHUB_ENV

      - name: 7z split (30 MB volumes)
        shell: pwsh
        run: |
          $name = $env:RELEASE_NAME
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=9 -mf=off -mmt=on -v30m `
            "release/${name}.7z" "release/${name}/" | Out-Null
          Get-ChildItem -Path release -Filter "${name}.7z.*"

      - name: Upload to Gitee release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REL_ID: ${{ needs.prepare-release.outputs.gitee_release_id }}
        shell: pwsh
        run: |
          $name = $env:RELEASE_NAME
          $files = Get-ChildItem -Path release -Filter "${name}.7z.*" | Sort-Object Name
          foreach ($f in $files) {
            $attempt = 0
            $ok = $false
            while ($attempt -lt 3 -and -not $ok) {
              $attempt++
              Write-Host "Uploading $($f.Name) (attempt $attempt)..."
              $exit = & curl.exe -sS --max-time 1800 -X POST `
                "https://gitee.com/api/v5/repos/${{ env.GITEE_OWNER }}/${{ env.GITEE_REPO }}/releases/${env:REL_ID}/attach_files" `
                -F "access_token=${env:GITEE_TOKEN}" `
                -F "file=@$($f.FullName)"
              if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 10 }
            }
            if (-not $ok) { Write-Host "::error::Failed to upload $($f.Name)"; exit 1 }
          }

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Release ${{ needs.prepare-release.outputs.tag }}
          draft: false
          prerelease: false
          files: release/satellite_debug_tool-win-${{ needs.prepare-release.outputs.tag }}.7z.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 2b. build-macos  (arm64)
  # ============================================================
  build-macos:
    runs-on: macos-14
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r satellite_debug_tool/requirements.txt

      - name: Install 7-Zip
        run: brew install p7zip

      - name: Build (main + updater + simulator)
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Layout release dir
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          NAME="satellite_debug_tool-mac-${TAG}"
          mkdir -p "release/${NAME}"
          cp -R dist/SatelliteDebugTool.app "release/${NAME}/"
          [ -f BUILDING.md ] && cp BUILDING.md "release/${NAME}/使用说明.md" || true
          echo "RELEASE_NAME=${NAME}" >> $GITHUB_ENV

      - name: 7z split (30 MB volumes)
        run: |
          NAME="${RELEASE_NAME}"
          # -snl 保留符号链接（mac .app 的 Python.framework / Qt frameworks
          # 内含大量 symlink，不加 -snl 会被序列化成文本文件，导致 dlopen 失败）
          7z a -t7z -mx=9 -mf=off -mmt=on -snl -v30m \
            "release/${NAME}.7z" "release/${NAME}/" > /dev/null
          ls -lh release/${NAME}.7z.*

      - name: Upload to Gitee release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REL_ID: ${{ needs.prepare-release.outputs.gitee_release_id }}
        run: |
          NAME="${RELEASE_NAME}"
          for f in release/${NAME}.7z.*; do
            attempt=0
            ok=0
            while [[ $attempt -lt 5 && $ok -eq 0 ]]; do
              attempt=$((attempt+1))
              echo "Uploading $f (attempt $attempt)..."
              if curl -sS --max-time 3600 -X POST \
                "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${REL_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${f}"; then
                ok=1
              else
                sleep 10
              fi
            done
            if [[ $ok -eq 0 ]]; then
              echo "::error::Failed to upload $f after 5 attempts"
              exit 1
            fi
          done

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Release ${{ needs.prepare-release.outputs.tag }}
          draft: false
          prerelease: false
          files: release/satellite_debug_tool-mac-${{ needs.prepare-release.outputs.tag }}.7z.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 3. finalize-release  生成最终 release body + 清理旧 release
  # ============================================================
  finalize-release:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-windows, build-macos]
    if: always() && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.prepare-release.result == 'success'
    steps:
      - name: Generate release body
        id: body
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REL_ID: ${{ needs.prepare-release.outputs.gitee_release_id }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          ASSETS_JSON=$(curl -sS "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${REL_ID}?access_token=${GITEE_TOKEN}")
          # 用 python 拼 markdown
          python3 <<PYEOF > /tmp/release_body.md
          import json, os
          d = json.loads('''$ASSETS_JSON''')
          assets = d.get("assets") or []
          mac = sorted([a for a in assets if "-mac-" in a.get("name", "")], key=lambda x: x["name"])
          win = sorted([a for a in assets if "-win-" in a.get("name", "")], key=lambda x: x["name"])
          tag = os.environ["TAG"]
          gh_owner = os.environ.get("GITHUB_OWNER", "${{ env.GITHUB_OWNER }}")
          gh_repo = os.environ.get("GITHUB_REPO", "${{ env.GITHUB_REPO }}")
          out = [f"# Satellite Debug Tool {tag}", ""]
          out += ["## 下载（推荐从 Gitee）", ""]
          if mac:
              out.append("### macOS (Apple Silicon)")
              for a in mac:
                  mb = a.get("size", 0) / 1024 / 1024
                  out.append(f"- [{a['name']}]({a['browser_download_url']}) ({mb:.2f} MB)")
              out.append("")
          if win:
              out.append("### Windows (x86_64)")
              for a in win:
                  mb = a.get("size", 0) / 1024 / 1024
                  out.append(f"- [{a['name']}]({a['browser_download_url']}) ({mb:.2f} MB)")
              out.append("")
          out += [
              "## 安装",
              "",
              "1. 下载平台对应的全部分卷（`.7z.001`, `.7z.002`, ...）",
              "2. 用 [7-Zip](https://www.7-zip.org/) 或 [The Unarchiver](https://theunarchiver.com/) 解压第一个分卷（其余自动合并）",
              f"3. macOS: 拖 SatelliteDebugTool.app 到 /Applications；首次打开见 [BUILDING.md](https://github.com/{gh_owner}/{gh_repo}/blob/master/BUILDING.md) 解决「无法验证开发者」提示",
              "4. Windows: 解压后双击 SatelliteDebugTool.exe；首次运行 SmartScreen 选「仍要运行」",
              "",
              "## 自动升级",
              "",
              "应用内置自动升级。默认每 24h 后台检查；也可工具栏点 🔄 检查更新 手动触发。",
              "",
              "---",
              "",
              "GitHub 镜像（海外用户）：见 Release Assets 同名分卷。",
          ]
          print("\n".join(out))
          PYEOF
          BODY=$(cat /tmp/release_body.md)
          echo "${BODY}"
          # 用 jq 生成 json payload（防转义炸）
          PAYLOAD=$(python3 -c "import json,os; print(json.dumps({'tag_name':os.environ['TAG'],'name':'Release '+os.environ['TAG'],'body':open('/tmp/release_body.md').read(),'prerelease':False}))")
          curl -sS -X PATCH \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${REL_ID}?access_token=${GITEE_TOKEN}" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -d "${PAYLOAD}" > /dev/null
          echo "Release body updated."

      - name: Cleanup old Gitee releases (keep latest 3)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          ALL=$(curl -sS "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases?access_token=${GITEE_TOKEN}&per_page=100")
          OLD=$(echo "$ALL" | python3 -c "
          import json, sys
          arr = json.load(sys.stdin)
          arr.sort(key=lambda x: x.get('created_at',''), reverse=True)
          for r in arr[3:]:
              print(r['id'])
          ")
          for id in $OLD; do
            echo "Deleting old Gitee release $id"
            curl -sS -X DELETE "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${id}?access_token=${GITEE_TOKEN}" || true
          done

  # ============================================================
  # 4. ci-only-build  (master/main 推送 → 仅本地构建验证 + 上传 GH artifact)
  # ============================================================
  ci-only-build:
    name: CI build (no release)
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            script: bash scripts/build_macos.sh
          - os: windows-latest
            arch: x86_64
            script: scripts\build_windows.bat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r satellite_debug_tool/requirements.txt
      - name: Build
        shell: bash
        run: ${{ matrix.script }}
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SatelliteDebugTool-${{ runner.os }}-${{ matrix.arch }}-ci
          path: release/*.zip
          retention-days: 7
          if-no-files-found: warn
