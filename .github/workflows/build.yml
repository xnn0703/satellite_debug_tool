name: Build & Release

# 触发：
#   - 推 v* tag → 完整 GitHub Release（prepare → Windows build → upload）
#   - 手动 dispatch → 同上（input 自定 tag）
#   - 推到 master/main → 仅构建并上传 GH artifact（不发版）
on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.0.1-rc1'

# 给所有 job 默认权限：contents: write 是创建 / 上传 GitHub Release 所需
permissions:
  contents: write

jobs:

  # ============================================================
  # 1. prepare-release  仅 tag/dispatch 时跑：解析发布标签
  # ============================================================
  prepare-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved tag: ${TAG}"

      - name: Remove stale v1.1.0 Gitee release metadata
        if: steps.resolve.outputs.tag == 'v1.1.0'
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          RESP=$(curl -sS --connect-timeout 5 --max-time 15 \
            "https://gitee.com/api/v5/repos/soft-hertz/satellite_debug_tool_release/releases/tags/v1.1.0" || true)
          REL_ID=$(echo "$RESP" | python3 -c "import sys,json
          try:
            d=json.load(sys.stdin); print(d.get('id') or '')
          except Exception:
            print('')")
          if [[ -n "${REL_ID}" ]]; then
            curl --fail-with-body --show-error --silent --connect-timeout 5 --max-time 15 \
              -X DELETE \
              "https://gitee.com/api/v5/repos/soft-hertz/satellite_debug_tool_release/releases/${REL_ID}?access_token=${GITEE_TOKEN}"
            echo "Removed stale Gitee release metadata id=${REL_ID}"
          else
            echo "No stale Gitee v1.1.0 release metadata found"
          fi

  # ============================================================
  # 2a. build-windows
  # ============================================================
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        edition: [user, ops]
    runs-on: windows-latest
    needs: prepare-release
    # 推 master/main 时 prepare-release 跳过，所以 needs 为 null → 这里也跳过
    if: always() && needs.prepare-release.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r satellite_debug_tool/requirements.txt

      - name: Build (main + updater)
        shell: cmd
        run: scripts\build_windows.bat ${{ matrix.edition }}

      - name: Smoke-test the frozen edition
        timeout-minutes: 3
        run: python scripts/check_frozen_application.py --edition ${{ matrix.edition }} --version "${{ needs.prepare-release.outputs.tag }}"

      - name: Upload frozen smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.edition }}
          path: release/smoke-*
          if-no-files-found: warn
          retention-days: 14

      - name: Layout release dir
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare-release.outputs.tag }}"
          $name = if ("${{ matrix.edition }}" -eq "user") { "satellite_terminal_tool-user-windows-${tag}" } else { "satellite_debug_tool-win-${tag}" }
          echo "RELEASE_NAME=${name}" >> $env:GITHUB_ENV

      - name: Create 7z archive
        shell: pwsh
        run: |
          $name = $env:RELEASE_NAME
          $archive = Join-Path "${{ github.workspace }}" "release/${name}.7z"
          $folder = if ("${{ matrix.edition }}" -eq "user") { "SatelliteTerminalToolUser" } else { "SatelliteDebugTool" }
          Push-Location "dist/${{ matrix.edition }}/${folder}"
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=9 -mf=off -mmt=on `
            $archive "*" | Out-Null
          $archiveExitCode = $LASTEXITCODE
          Pop-Location
          if ($archiveExitCode -ne 0) {
            throw "7-Zip failed with exit code $archiveExitCode"
          }
          Get-Item $archive

      - name: Validate updater payload layout
        shell: pwsh
        run: |
          $name = $env:RELEASE_NAME
          python scripts/verify_update_archive.py "release/${name}.7z" --edition "${{ matrix.edition }}" --version "${{ needs.prepare-release.outputs.tag }}"

      - name: Upload validated edition archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.edition }}
          path: release/*.7z
          if-no-files-found: error
          retention-days: 7

  publish-windows:
    runs-on: ubuntu-latest
    needs: [prepare-release, build-windows]
    if: always() && needs.prepare-release.result == 'success' && needs.build-windows.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish both validated editions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Release ${{ needs.prepare-release.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body_path: doc/${{ needs.prepare-release.outputs.tag }}_release_notes.md
          files: |
            release/satellite_terminal_tool-user-windows-${{ needs.prepare-release.outputs.tag }}.7z
            release/satellite_debug_tool-win-${{ needs.prepare-release.outputs.tag }}.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # build-macos 已移除：mac 在线打包遇到 PyInstaller .app symlink 复杂性
  # （Python.framework / Qt frameworks 1500+ symlinks + 7z 不稳定），改本地脚本：
  #     ./scripts/build_macos.sh both
  # 本地脚本会自动 venv + 装依赖 + ditto 打包，产物 release/SatelliteDebugTool-<user|ops>-macOS-<arch>.zip
  # mac 用户拿到 zip 解压双击即可；mac 平台不走自动升级链路（updater 仍嵌入但触发频率为零）。

  # ============================================================
  # 3. ci-only-build  (master/main 推送 → 仅本地构建验证 + 上传 GH artifact)
  # ============================================================
  ci-only-build:
    strategy:
      fail-fast: false
      matrix:
        edition: [user, ops]
    name: CI build (no release, win only)
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r satellite_debug_tool/requirements.txt
      - name: Build
        shell: cmd
        run: scripts\build_windows.bat ${{ matrix.edition }}
      - name: Smoke-test the frozen edition
        timeout-minutes: 3
        run: python scripts/check_frozen_application.py --edition ${{ matrix.edition }}
      - name: Upload CI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-${{ matrix.edition }}
          path: release/smoke-*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SatelliteDebugTool-${{ matrix.edition }}-Windows-ci
          path: release/*.zip
          retention-days: 7
          if-no-files-found: warn
